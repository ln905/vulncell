# DEMO toàn hệ thống bằng 1 lệnh:  npm run demo     (hoặc: docker compose -p vulncell-demo -f docker-compose.demo.yml up --build)
# Mở http://localhost:8080
#
# QUAN TRỌNG: luôn chạy kèm `-p vulncell-demo` (npm run demo đã bao gồm).
# Vì file này dùng cùng tên service (db/redis) với docker-compose.yml gốc — nếu không tách
# project name, Docker Compose sẽ "Recreate" nhầm container db/redis của bản DEV.
#
# Khác với docker-compose.yml (chỉ Postgres+Redis cho dev):
#   - Đây là bản "đóng gói": backend + frontend chạy trong container
#   - Chỉ mở DUY NHẤT cổng 8080 (nginx) -> không đụng port dev 4000/5173
#   - Database/Redis dùng volume riêng (vulncell_demo_db_data), không lẫn dữ liệu dev
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vulncell
      POSTGRES_PASSWORD: vulncell
      POSTGRES_DB: vulncell
    volumes:
      - demo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulncell"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vulncell:vulncell@db:5432/vulncell?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      JWT_SECRET: vulncell-demo-secret-chi-dung-cho-demo-local
      # Tên cookie riêng của demo — tránh ghi đè phiên dev trên cùng host localhost
      COOKIE_NAME: vc_demo_token
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
      RATE_LIMIT_DISABLED: "false"
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  demo_db_data:
